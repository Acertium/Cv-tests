<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Test Policía Local CV · Vol. IV</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="app">

  <header class="topbar">
    <div class="brand">
      <div class="crest">PL</div>
      <div class="brand-text">
        <strong>Test Policía Local</strong>
        <span>Comunitat Valenciana · Vol. IV</span>
      </div>
    </div>
    <button class="btn-reset" id="resetBtn">Reiniciar tema</button>
  </header>

  <nav class="tema-strip" id="temaStrip"></nav>

  <div class="disclaimer">
    <strong>Aviso:</strong> Respuestas verificadas contra el solucionario oficial del Volumen IV.
    Si detectas algún error, comunícalo para corregirlo de inmediato.
  </div>

  <section class="hero">
    <h1 class="hero-title" id="heroTitle"></h1>
    <p  class="hero-sub"   id="heroSub"></p>
    <div class="stats-row">
      <div class="stat"><div class="stat-num"     id="statTotal">0</div><div class="stat-lbl">Contestadas</div></div>
      <div class="stat"><div class="stat-num ok"  id="statOk">0</div><div class="stat-lbl">Acertadas</div></div>
      <div class="stat"><div class="stat-num err" id="statErr">0</div><div class="stat-lbl">Falladas</div></div>
    </div>
    <div class="progress-bar"><div class="progress-fill" id="progressFill" style="width:0%"></div></div>
    <div class="progress-meta">
      <span id="progressText">0 de 0</span>
      <span id="progressPct">0%</span>
    </div>
  </section>

  <div id="qZone"></div>

</div>

<nav class="navbar">
  <button class="nav-btn" id="prevBtn" disabled aria-label="Anterior">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
  </button>
  <div class="nav-counter">Pregunta <strong id="navIdx">—</strong> / <span id="navTotal">—</span></div>
  <button class="nav-btn" id="gridBtn" aria-label="Índice">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/></svg>
  </button>
  <button class="nav-btn" id="nextBtn" disabled aria-label="Siguiente">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>
  </button>
</nav>

<div class="modal-bg" id="modalBg"><div class="modal" id="modalBox"></div></div>
<div class="toast" id="toast"></div>

<script src="js/app.js"></script>
</body>
</html>
