<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Test Movilidad Urbana</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
</head>
<body>

  <!-- TOPBAR -->
  <div class="topbar">
    <div class="topbar__brand">
      <div class="topbar__icon">MU</div>
      <span class="topbar__title">Test Movilidad Urbana</span>
    </div>
    <button class="topbar__menu" id="pickerBtn" onclick="openPicker()" title="Seleccionar tema">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
    </button>
  </div>

  <!-- SUBBAR -->
  <div class="subbar" id="subbar">
    <button class="subbar__btn" id="subbarStreak" onclick="openStreakModal()" title="Racha diaria">
      <span id="subbarFlame">🔥</span>
      <span id="subbarStreakLabel"></span>
    </button>
    <button class="subbar__btn" onclick="openSim()" title="Examen simulacro">
      🧩 Simulacro
    </button>
    <button class="subbar__btn" onclick="openGlobalStats()" title="Estadisticas globales">
      📊 Estadisticas
    </button>
    <button class="subbar__btn subbar__btn--cajon" id="subbarCajon" onclick="openCajon()" title="Cajón de errores del simulacro">
      📦 Cajón <span class="subbar__badge" id="cajonBadge"></span>
    </button>
    <button class="subbar__btn subbar__btn--help" onclick="openManual()" title="Manual de usuario" style="margin-left:auto; flex-shrink:0;">
      ?
    </button>
  </div>

  <!-- MODAL RACHA -->
  <div class="streak-modal-overlay" id="streakModalOverlay" onclick="closeStreakModal()">
    <div class="streak-modal" onclick="event.stopPropagation()">
      <div class="streak-modal__header">
        <span class="streak-modal__title">🔥 Racha de estudio</span>
        <button class="streak-modal__close" onclick="closeStreakModal()">✕</button>
      </div>
      <div class="streak-modal__body" id="streakModalBody"></div>
    </div>
  </div>

  <!-- MODAL ESTADISTICAS GLOBALES -->
  <div class="streak-modal-overlay" id="globalStatsOverlay" onclick="closeGlobalStats()">
    <div class="streak-modal streak-modal--wide" onclick="event.stopPropagation()">
      <div class="streak-modal__header">
        <span class="streak-modal__title">📊 Estadísticas globales</span>
        <button class="streak-modal__close" onclick="closeGlobalStats()">✕</button>
      </div>
      <div class="streak-modal__body" id="globalStatsBody"></div>
    </div>
  </div>

  <!-- MANUAL OVERLAY -->
  <div class="manual-overlay" id="manualOverlay">
    <div class="manual-sheet">
      <div class="manual-topbar">
        <span class="manual-topbar__title">Manual de usuario</span>
        <button class="manual-close" onclick="closeManual()">✕</button>
      </div>
      <iframe class="manual-frame" id="manualFrame" src="" title="Manual de usuario"></iframe>
    </div>
  </div>

  <!-- NOTICE -->
  <div class="notice">
    Respuestas verificadas contra el solucionario oficial. Si detectas algún error, lo puedes editar ✏️
  </div>

  <!-- CONTENIDO PRINCIPAL -->
  <div class="app-wrap">
    <div class="hero" id="hero"></div>
    <div id="nav"></div>
    <div id="card"></div>
  </div>

  <!-- PICKER OVERLAY -->
  <div class="picker-overlay" id="pickerOverlay" onclick="handleOverlayClick(event)">
    <div class="picker-sheet" id="pickerSheet">
      <div class="picker-header">
        <span class="picker-title">Seleccionar tema</span>
        <button class="picker-close" onclick="closePicker()">✕</button>
      </div>
      <div class="picker-body" id="pickerBody"></div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <!-- EXAMEN OVERLAY -->
  <div class="exam-overlay" id="examOverlay">
    <div class="exam-sheet">
      <div class="exam-header">
        <span class="exam-title">⏱ Examen cronometrado</span>
        <span class="exam-timer" id="examTimer">10:00</span>
        <button class="exam-close" onclick="closeExam()">✕</button>
      </div>
      <div class="exam-body" id="examBody"></div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="cloud/config.js"></script>
  <script src="cloud/cloud.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
